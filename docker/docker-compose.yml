version: "3.8"

services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: es
    environment:
      - node.name=es
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms1g -Xmx1g

      # ---- Security ON (required for Kibana connectors) ----
      - xpack.security.enabled=true

      # Set the built-in elastic user password
      - ELASTIC_PASSWORD=C7cmrEkygq9=JTU7HTAu
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - docker_elk

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.10
    container_name: kibana
    depends_on:
      - es
    environment:
      - ELASTICSEARCH_HOSTS=http://es:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=C7cmrEkygq9=JTU7HTAu

      # ---- REQUIRED for connectors/alerting ----
      - xpack.encryptedSavedObjects.encryptionKey=this_is_a_32_plus_characters_demo_key_12345
      - xpack.security.encryptionKey=this_is_a_32_plus_characters_security_key_123456
      - xpack.reporting.encryptionKey=this_is_a_32_plus_characters_reporting_key_12345
    ports:
      - "5601:5601"
    networks:
      - docker_elk

  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.10
    container_name: logstash
    depends_on:
      - es
    ports:
      - "5044:5044"
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
      - ES_HOST=http://es:9200
      - ES_USER=elastic
      - ES_PASS=ChangeMeStrong123!
    volumes:
      - ../logstash/pipeline:/usr/share/logstash/pipeline:ro
    networks:
      - docker_elk

volumes:
  esdata:

networks:
  docker_elk:
    driver: bridge

