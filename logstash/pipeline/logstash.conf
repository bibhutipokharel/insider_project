input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  # Fix timestamp if generator sent "timestamp" instead of "@timestamp"
  if ![@timestamp] and [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Extra enforcement: suspicious websites
  if [action] == "web_access" and [url] {
    if [url] in ["mega.nz", "dropbox.com", "pastebin.com", "anonfiles.com", "darkweb.onion"] {
      mutate {
        replace => { "is_suspicious" => true }
      }
      mutate {
        add_field => { "suspicious_reason" => "suspicious_website" }
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://es:9200"]
    index => "user-activity-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "C7cmrEkygq9=JTU7HTAu"
  }
  stdout { codec => rubydebug }
}


